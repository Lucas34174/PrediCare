[project]
name = "predicare-tpa"
version = "0.1.0"
description = "PrediCare TPA - détection de fraudes santé, RAG et pilotage"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = pycodestyle (PEP8), F = pyflakes, I = isort, N = pep8-naming
select = ["E", "W", "F", "I", "N", "B", "UP"]
ignore = [
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
