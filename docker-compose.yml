# PrediCare TPA : plateforme complète avec `docker compose up`.
# Prérequis : cp .env.example .env (les secrets restent hors Git).
name: predicare-tpa

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: predicare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-predicare}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Fichier .env manquant : lancez cp .env.example .env}"
      POSTGRES_DB: ${POSTGRES_DB:-predicare}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: .
    image: predicare-tpa/api:dev
    container_name: predicare-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-predicare}
      DB_USER: ${POSTGRES_USER:-predicare}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant dans .env}"
      PII_ENCRYPTION_KEY: "${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY manquant dans .env}"
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-0.5}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/claim-alert}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DATA_DIR: /data/raw
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      RAG_CORPUS_DIR: ${RAG_CORPUS_DIR:-/data/raw}
    volumes:
      - ./data/raw:/data/raw:ro
      - ./migrations:/app/migrations
      - ./tests:/app/tests
      - ./docs:/app/docs
      - ./src:/app/src
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.4
    container_name: predicare-n8n
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-predicare}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY manquant dans .env}"
      GENERIC_TIMEZONE: ${TZ:-Indian/Antananarivo}
      TZ: ${TZ:-Indian/Antananarivo}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  front:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
    image: predicare-tpa/front:dev
    container_name: predicare-front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-3000}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  ollama:
    image: ollama/ollama:0.3.14
    container_name: predicare-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  n8n_data:
  ollama_data:
